name: Pull TurboWarp UI Code
on:
  workflow_dispatch: # This adds a manual "Run button" to your GitHub page

permissions:
  contents: write

jobs:
  pull-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Clone TurboWarp GUI files
        run: |
          git clone --depth=1 https://github.com temp-tw
          # This safely merges TurboWarp's files without erasing your license or workflow folder
          rsync -av --exclude='.git' --exclude='.github' temp-tw/ .
          rm -rf temp-tw

      - name: Commit and Push to your repository
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Merged complete TurboWarp UI files into repository"
          git push origin main
